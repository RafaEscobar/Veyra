name: veyra
description: 'Bóveda local y privada para fotos, videos y archivos.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  sqflite: ^2.4.4
  uuid: ^4.6.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
